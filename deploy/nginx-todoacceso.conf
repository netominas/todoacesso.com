# Todo Acceso — Nginx + PHP-FPM (Ubuntu/Debian).
# Copiar a /etc/nginx/sites-available/todoacceso.com, enlazar en sites-enabled y recargar.
# Los certificados los gestiona Certbot (ver README). Reemplazar rutas si cambia el layout del servidor.

# --- Rate limiting (este archivo se incluye dentro de http { }) ---
map $request_uri $ta_sensitive_key {
    default "";
    ~^/buscar                            $binary_remote_addr;
    ~^/estado/[^/]+/(reportar|verificar) $binary_remote_addr;
    ~^/admin/login                       $binary_remote_addr;
}
limit_req_zone $ta_sensitive_key zone=ta_sensitive:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ta_general:10m rate=10r/s;
limit_req_status 429;

# --- HTTP: ACME + redirección a HTTPS (dominio sin www como canónico) ---
server {
    listen 80;
    listen [::]:80;
    server_name todoacceso.com www.todoacceso.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://todoacceso.com$request_uri;
    }
}

# --- HTTPS: www -> apex ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.todoacceso.com;

    ssl_certificate     /etc/letsencrypt/live/todoacceso.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todoacceso.com/privkey.pem;

    return 301 https://todoacceso.com$request_uri;
}

# --- HTTPS: sitio ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name todoacceso.com;

    ssl_certificate     /etc/letsencrypt/live/todoacceso.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todoacceso.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/todoacceso/public;
    index index.php;
    charset utf-8;

    client_max_body_size 6m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Nunca servir archivos ocultos (salvo ACME) ni código/datos fuera de /public
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(storage|src|views|config|database|bin|tests|resources|deploy)/ { deny all; }
    location ~* \.(sqlite|sqlite3|db|log|env|md|json|lock|sh|sql)$ { deny all; }

    # Estáticos versionados (?v=timestamp): caché larga
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Imágenes importadas/subidas: nunca ejecutar PHP aquí
    location ^~ /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; sandbox" always;
        location ~* \.(php|phtml|phar|html?|svg)$ { return 403; }
        try_files $uri =404;
    }

    location = /favicon.ico { return 301 /assets/img/favicon-32.png; }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Único script PHP ejecutable: el controlador frontal
    location = /index.php {
        limit_req zone=ta_sensitive burst=10 nodelay;
        limit_req zone=ta_general burst=40 nodelay;

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }

    access_log /var/log/nginx/todoacceso.access.log;
    error_log  /var/log/nginx/todoacceso.error.log warn;
}
