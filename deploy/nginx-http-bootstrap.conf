# Configuración mínima (solo HTTP) para obtener el primer certificado con Certbot.
# Usar ANTES de nginx-todoacceso.conf; después reemplazar por la configuración completa.
server {
    listen 80;
    listen [::]:80;
    server_name todoacceso.com www.todoacceso.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 200 'Todo Acceso - configurando';
        add_header Content-Type text/plain;
    }
}
